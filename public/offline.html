<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <title>BitFactory - Offline</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #132238 0%, #090d16 80%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(18, 26, 43, 0.75);
      border: 1px solid rgba(56, 182, 255, 0.2);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(15, 118, 110, 0.2);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .logo-badge {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.4), rgba(56, 182, 255, 0.2));
      border: 1px solid rgba(56, 182, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 20px rgba(56, 182, 255, 0.3);
    }
    .signal-icon {
      width: 44px;
      height: 44px;
      fill: none;
      stroke: #38b6ff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn-retry {
      background: linear-gradient(135deg, #0f766e 0%, #0d9488 100%);
      color: #ffffff;
      border: none;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-retry:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(15, 118, 110, 0.45);
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ef4444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-badge">
      <svg class="signal-icon" viewBox="0 0 24 24">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0 1 19 12.55M5 12.55a10.94 10.94 0 0 1 5.17-2.39M10.71 5.05A16 16 0 0 1 22.58 9M1.42 9a15.91 15.91 0 0 1 4.7-2.88M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/>
      </svg>
    </div>

    <div class="badge">
      <span class="dot"></span>
      No Internet Connection
    </div>

    <h1>You are currently offline</h1>
    <p>
      BitFactory requires an active internet connection to stream live hashrates, pool statistics, and manage your account.
    </p>

    <button class="btn-retry" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      Retry Connection
    </button>
  </div>

  <script>
    window.addEventListener("online", function () {
      window.location.reload();
    });
  </script>
</body>
</html>
